name: Python research checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install test dependencies
        run: python -m pip install -r requirements-ci.txt
      - name: Compile maintained Python modules
        run: python -m compileall -q FP_PINN/pinn hyqmom_fp examples tests
      - name: Run lightweight suite
        env:
          MPLBACKEND: Agg
        run: python -m pytest -q
